name: CursosIpad

options:
  bundleIdPrefix: mx.salez
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""

packages:
  Shared:
    path: Shared

targets:
  CursosIpad:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Resources
    dependencies:
      - package: Shared
        product: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Cursos
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "Cursos usa tu red local para copiar cursos desde tu Mac."
        NSBonjourServices:
          - _cursosipad._tcp
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.salez.cursosipad
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CursosIpadMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Resources
    dependencies:
      - package: Shared
        product: Shared
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Cursos
        CFBundleName: cursosIpad
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026"
        NSLocalNetworkUsageDescription: "Cursos usa tu red local para copiar cursos a tu iPad o iPhone."
        NSBonjourServices:
          - _cursosipad._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.salez.cursosipad.macos
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CursosIpad:
    build:
      targets:
        CursosIpad: all
    run:
      config: Debug
  CursosIpadMac:
    build:
      targets:
        CursosIpadMac: all
    run:
      config: Debug
